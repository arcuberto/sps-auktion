<style>
  :root { --navy:#132D62; --ink:#1F2A44; --blue:#DDEBF7; --pale:#EEF2F7; --line:#C9D6E8; --mid:#5B7DB8; --ok:#2E7D4F; --warn:#B3261E; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Tw Cen MT","Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:#F4F6FA; }

  header .logo { height:56px; }
  header .ttl { flex:1; line-height:1.15; }
  header .ttl b { display:block; color:var(--navy); font-size:19px; }
  header .ttl span { color:#6B7A99; font-size:13px; }
  header .bee { height:54px; }
  #hdr { font-size:12px; color:#6B7A99; }
  #hdr.on::before { content:"● "; color:#2E7D4F; } #hdr.off::before { content:"● "; color:#B3261E; }
  .card { box-shadow:0 1px 4px rgba(19,45,98,.06); }
  footer { text-align:center; padding:18px 0 26px; color:#8A97B3; font-size:12px; }
  footer img { height:22px; vertical-align:middle; margin-right:6px; opacity:.85; }
  main { padding:16px; max-width:1200px; margin:0 auto; }
  h1 { color:var(--navy); font-size:26px; margin:6px 0 12px; }
  h2 { color:var(--navy); font-size:19px; margin:18px 0 8px; }
  .card { background:var(--blue); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin:10px 0; }
  .pale { background:var(--pale); }
  button { font:inherit; font-size:17px; border:0; border-radius:10px; padding:12px 16px; background:var(--navy); color:#fff; cursor:pointer; }
  button.sec { background:#fff; color:var(--navy); border:1px solid var(--navy); }
  button:disabled { opacity:.35; cursor:default; }
  input, select { font:inherit; font-size:18px; padding:10px; border:1px solid var(--line); border-radius:10px; width:100%; background:#fff; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .row > * { flex:1; }
  .muted { color:#6B7A99; font-size:14px; }
  .big { font-size:44px; font-weight:700; color:var(--navy); }
  .huge { font-size:84px; font-weight:700; color:var(--navy); line-height:1; }
  .msg { padding:10px 12px; border-radius:10px; margin-top:8px; font-size:16px; }
  .msg.err { background:#FDECEA; color:var(--warn); } .msg.ok { background:#E7F4EC; color:var(--ok); }
  table { border-collapse:collapse; width:100%; font-size:15px; }
  th, td { border:1px solid var(--line); padding:6px 8px; text-align:left; }
  th { background:var(--blue); color:var(--navy); }
  tr:nth-child(even) td { background:var(--pale); }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .bar { height:28px; background:var(--navy); border-radius:6px; }
  .bar.b2 { background:var(--mid); }
  .barrow { display:grid; grid-template-columns:minmax(90px,170px) minmax(90px,1fr) 70px; gap:10px; align-items:center; margin:6px 0; }
  .tabs { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .tabs button { font-size:15px; padding:8px 12px; }
  .tabs button.on { background:var(--mid); }
  .hide { display:none !important; }
  .slider { width:100%; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { background:#fff; border:1px solid var(--line); border-radius:20px; padding:4px 10px; font-size:14px; }
  .chip.sold { background:var(--navy); color:#fff; border-color:var(--navy); }
  .chip.now { background:var(--mid); color:#fff; border-color:var(--mid); }
  .call { font-size:34px; font-weight:700; color:var(--warn); min-height:44px; }
</style>

/* ===== Budget-Berechnung ===== */
function spent(card) { let s = 0; Object.values(S.results).forEach(r => { if (r && r.card === card) s += r.amount; }); return s; }
function budget(card) { return START - spent(card); }
function maxBids() {
  // { card: { itemIdx: maxAmount } }
  const m = {};
  Object.entries(S.bids).forEach(([i, list]) => Object.values(list || {}).forEach(b => {
    m[b.card] = m[b.card] || {}; m[b.card][i] = Math.max(m[b.card][i] || 0, b.amount);
  }));
  return m;
}

/* ===== Aktionen Auktion ===== */
async function placeBid(card, amount) {
  const a = S.auction;
  if (a.phase !== "bidding") return "Gerade läuft keine Versteigerung.";
  if (!Number.isFinite(amount) || amount <= 0 || amount % 25 !== 0) return "Bitte in 25er-Schritten bieten.";
  if (amount > budget(card)) return "So viel Geld hast du nicht mehr.";
  const item = a.item;
  const res = await R("auction").transaction(cur => {
    if (!cur || cur.phase !== "bidding" || cur.item !== item) return; // abbrechen
    const high = (cur.high && cur.high.amount) || 0;
    if (amount <= high) return;
    cur.high = { amount, card, t: Date.now() };
    cur.call = 0;
    return cur;
  });
  if (!res.committed) return "Jemand hat schon mehr geboten.";
  R("bids/" + item).push({ card, amount, t: Date.now() });
  return null;
}
